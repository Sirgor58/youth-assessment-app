{% extends 'base.html' %}{% block content %}<div class="titlebar"><div><h1>Assessment</h1><p class="muted">{{p.participant_name}} • {{p.participant_id}}</p></div></div><form method="post" class="card formcard"><label>Person Conducting Assessment</label><input name="assessor_name" value="{{session.user}}" required><label>Date of Assessment</label><input type="date" name="assessment_date" value="{{request.form.get('assessment_date','')}}" required><label>Assessment Period</label><select name="assessment_period">{% for x in periods %}<option {{'selected' if period==x}}>{{x}}</option>{% endfor %}</select><label>Assessment Area</label><select name="assessment_area" onchange="this.form.submit()"><option value="">Select Assessment Area</option>{% for x in areas %}<option value="{{x}}" {{'selected' if area==x}}>{{x}}</option>{% endfor %}</select>{% if questions %}<h2>{{area}}</h2>{% for q in questions %}<div class="question"><b>{{loop.index}}. {{q}}</b><select name="q{{loop.index}}" required><option value="">Select Score</option>{% for n,text in [(0,'0 - Not Demonstrated'),(1,'1 - Needs Support'),(2,'2 - Improved'),(3,'3 - Enhanced'),(4,'4 - Transformational Growth')] %}<option value="{{n}}">{{text}}</option>{% endfor %}</select></div>{% endfor %}<label>Recommendation (optional)</label><textarea name="recommendation" placeholder="Leave blank for automatic recommendation"></textarea><button name="save" value="1">SAVE ASSESSMENT</button>{% else %}<p class="muted">Select an assessment area to display its five questions.</p>{% endif %}</form>{% endblock %}
